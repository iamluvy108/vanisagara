<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vāṇīsāgara (The Encyclopedia)</title>
    
    <!-- IMPORT NOTO SERIF & NOTO SERIF DEVANAGARI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;600;700&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
    
    <script>
        const savedTheme = localStorage.getItem('vanisagara_theme');
        if (savedTheme) { document.documentElement.setAttribute('data-theme', savedTheme); }
    </script>

    <style>
        /* --- ENABLE SMOOTH GRADIENT COLOR FADING --- */
        @property --hero-glow {
            syntax: '<color>';
            inherits: true;
            initial-value: #0288D1; 
        }

        /* --- STRICT GOOGLE MATERIAL THEME VARIABLES --- */
        :root {
            --bg-main: #202124;
            --bg-nav: rgba(32, 33, 36, 0.98);
            --hero-glow: #0288D1; 
            --text-primary: #e8eaed;
            --text-secondary: #9aa0a6;
            --accent: #8ab4f8;
            --btn-bg: #ffffff; 
            --btn-text: #202124; 
            --btn-hover: #e8eaed; 
            --card-bg: #28292a; 
            --modal-bg: #202124; 
            --border: #5f6368;
            --sys-yellow: #fbbc04; 
            --google-shadow: 0 1px 2px 0 rgba(0,0,0,0.3), 0 1px 3px 1px rgba(0,0,0,0.15);
            --google-shadow-hover: 0 1px 3px 0 rgba(0,0,0,0.3), 0 4px 8px 3px rgba(0,0,0,0.15);
            --icon-hover: rgba(255, 255, 255, 0.1);
            --nav-link-hover: rgba(255, 255, 255, 0.08);

            /* Reader Specific Variables */
            --book-text-color: #8ab4f8; 
            --toc-link-color: #8ab4f8; 
            --toc-hover-color: #ffffff;
            --reader-accent: #8ab4f8; /* Dark Mode Blue Accent */
        }

        [data-theme="light"] {
            --bg-main: #ffffff;
            --bg-nav: rgba(255, 255, 255, 0.98);
            --text-primary: #202124;
            --text-secondary: #5f6368;
            --accent: #1a73e8;
            --btn-bg: #1a73e8; 
            --btn-text: #ffffff; 
            --btn-hover: #1558d6; 
            --card-bg: #ffffff;
            --modal-bg: #ffffff; 
            --border: #dadce0;
            --sys-yellow: #fbbc04;
            --google-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
            --google-shadow-hover: 0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
            --icon-hover: rgba(0, 0, 0, 0.05);
            --nav-link-hover: rgba(0, 0, 0, 0.04);

            /* Reader Specific Variables */
            --book-text-color: #1a73e8;
            --toc-link-color: #1a73e8; 
            --toc-hover-color: #202124;
            --reader-accent: #800020; /* Light Mode Burgundy Accent */
        }

        html { 
            scroll-behavior: smooth; 
            scrollbar-gutter: stable; 
        }

        /* --- GLOBAL SCROLL LOCK --- */
        html.no-scroll, body.no-scroll { 
            overflow: hidden !important; 
            touch-action: none !important; 
        }

        /* --- GOOGLE TYPOGRAPHY --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Google Sans', 'Product Sans', Roboto, -apple-system, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            transition: background-color 0.4s ease, color 0.4s ease;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #main-content { backface-visibility: hidden; -webkit-backface-visibility: hidden; transform-style: preserve-3d; perspective: 1000px; will-change: transform, opacity; }
        .theme-toggle, .hamburger, .back-btn, .control-btn, .nav-verse-btn { backface-visibility: hidden; -webkit-backface-visibility: hidden; transform: translateZ(0); -webkit-font-smoothing: subpixel-antialiased; }

        #main-content { animation: appEnter 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s ease; width: 100%; overflow-x: hidden; }
        #main-content.page-exit { transform: translateY(-15px); opacity: 0; }
        @keyframes appEnter { 0% { transform: translateY(20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOutDown { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(15px); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }

        .fade-in-up { animation: fadeInUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .fade-out-down { animation: fadeOutDown 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .fade-in-down { animation: fadeInDown 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Dynamic Stagger / Domino effect */
        .filters-group.stagger-in .control-btn { opacity: 0; animation: fadeInUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .filters-group.stagger-in .control-btn:nth-child(2) { animation-delay: 0.05s; }
        .filters-group.stagger-in .control-btn:nth-child(3) { animation-delay: 0.10s; }
        .filters-group.stagger-in .control-btn:nth-child(4) { animation-delay: 0.15s; }
        .filters-group.stagger-in .control-btn:nth-child(5) { animation-delay: 0.20s; }
        .filters-group.stagger-in .control-btn:nth-child(6) { animation-delay: 0.25s; }
        .filters-group:not(.stagger-in) .control-btn { opacity: 1; animation: none; }

        /* --- GOOGLE WORKSPACE NAVIGATION --- */
        nav { position: fixed; top: 0; width: 100%; height: 64px; background: var(--bg-nav); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: space-between; padding: 0 12%; z-index: 100; border-bottom: 1px solid var(--border); transition: background 0.4s ease; }
        .nav-brand { display: flex; align-items: center; justify-content: center; height: 100%; text-decoration: none; }
        .brand-icon { width: 48px; height: 48px; object-fit: contain; margin-right: 6px; display: block; }
        .nav-controls { display: flex; align-items: center; gap: 8px; }
        .nav-links { display: flex; list-style: none; gap: 4px; margin-right: 12px; }
        .nav-links a { text-decoration: none; color: var(--text-primary); font-size: 14px; font-weight: 500; padding: 8px 16px; border-radius: 4px; transition: background-color 0.2s, color 0.2s; }
        .nav-links a:hover { background-color: var(--nav-link-hover); }
        .nav-divider { width: 1px; height: 32px; background-color: var(--border); margin: 0 8px; }
        .nav-icons { display: flex; align-items: center; gap: 4px; }
        
        .theme-toggle { background: transparent; border: none; color: var(--text-secondary); cursor: pointer; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background-color 0.2s ease, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .theme-toggle:active { transform: scale(0.9) translateZ(0); }
        .theme-toggle:hover { background-color: var(--icon-hover); color: var(--text-primary); }

        [data-theme="dark"] .logo-light { display: none; }
        [data-theme="light"] .logo-dark { display: none; }

        /* --- ENCYCLOPEDIA LOBBY & VIEWS --- */
        .sanctum-wrapper { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; padding: 140px 12% 100px 12%; overflow: hidden; z-index: 2; }
        
        .view-section { width: 100%; display: none; flex-direction: column; align-items: center; animation: fadeInUp 0.4s ease forwards; }
        .view-section.active { display: flex; }

        /* --- MATERIAL 3 READER CARD --- */
        .google-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 60px 60px;
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
            box-shadow: var(--google-shadow);
            display: flex;
            flex-direction: column;
            transition: background-color 0.4s ease, box-shadow 0.4s ease;
            position: relative; 
        }

        /* Enforce elegant serif strictly on reading material */
        .reader-container *, .toc-container *, .toc-link { font-family: 'Noto Serif', serif; }
        
        /* Ensure UI elements inside the card retain Google Sans */
        .nav-header-row *, .breadcrumb *, .back-btn, .control-btn, .nav-verse-btn, .search-pill * { font-family: 'Google Sans', 'Product Sans', Roboto, sans-serif !important; }

        /* --- NAVIGATION HEADER ROW --- */
        .nav-header-row { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }

        .breadcrumb { font-size: 14px; font-weight: 500; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; z-index: 10; }
        .breadcrumb a { color: var(--text-secondary); text-decoration: none; cursor: pointer; transition: color 0.2s; }
        @media (hover: hover) { .breadcrumb a:hover { color: var(--text-primary); } }
        .breadcrumb .separator { font-size: 12px; opacity: 0.5; letter-spacing: -1px; }

        .sanctum-header { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 50px; width: 100%; font-family: 'Google Sans', 'Product Sans', sans-serif !important; }
        .sanctum-title { font-size: clamp(40px, 6vw, 72px); font-weight: 400; line-height: 1.1; margin-bottom: 16px; color: var(--text-primary); font-family: 'Times New Roman', Times, serif !important; }

        #view-books .toc-link { color: var(--book-text-color); }
        #view-chapters .sanctum-title { font-size: clamp(28px, 4vw, 48px); margin-bottom: 20px; }

        /* --- BRANDING DIVIDER --- */
        .divider { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; justify-content: center; width: 100%; }
        .divider-line { height: 1px; width: 40px; background-color: var(--text-secondary); opacity: 0.5; }
        .divider-circle { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--text-secondary); opacity: 0.5; background-color: transparent; flex-shrink: 0; }

        /* --- ENCYCLOPEDIA SEARCH BAR --- */
        .search-container { width: 100%; display: flex; justify-content: center; margin-bottom: 30px; }
        .search-pill { display: flex; align-items: center; background-color: var(--bg-main); border: 1px solid var(--border); border-radius: 24px; padding: 8px 16px; width: 100%; max-width: 500px; transition: background-color 0.2s, box-shadow 0.2s, border-color 0.2s; font-family: 'Google Sans', 'Product Sans', sans-serif !important; }
        .search-pill:focus-within { background-color: var(--icon-hover); box-shadow: var(--google-shadow); border-color: transparent; }
        .search-icon { color: var(--text-secondary); margin-right: 12px; flex-shrink: 0; }
        .search-input { flex: 1; background: transparent; border: none; color: var(--text-primary); font-size: 15px; outline: none; min-width: 0; font-family: inherit; }
        .search-input::placeholder { color: var(--text-secondary); opacity: 0.7; }
        .search-divider { width: 1px; height: 20px; background-color: var(--border); margin: 0 12px; flex-shrink: 0; }
        .search-dropdown { background: transparent; border: none; color: var(--text-secondary); font-size: 14px; font-weight: 600; outline: none; cursor: pointer; font-family: inherit; }
        .search-dropdown option { background-color: var(--modal-bg); color: var(--text-primary); }

        .toc-container { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 22px; width: 100%; max-width: 900px; margin: 0 auto; text-align: left; }
        .toc-link { font-size: clamp(18px, 2.5vw, 24px); color: var(--toc-link-color); text-decoration: none; transition: opacity 0.2s ease, color 0.2s ease; display: block; line-height: 1.4; letter-spacing: 0.01em; cursor: pointer; }
        
        @media (hover: hover) { .toc-link:hover:not(.locked) { color: var(--toc-hover-color); opacity: 0.8; } }
        .toc-link:active:not(.locked) { opacity: 0.5; transition: opacity 0.1s ease; }
        .toc-link.locked { opacity: 0.35; pointer-events: none; cursor: default; }

        /* --- MATERIAL SEARCH FILTERS (ADVANCED CONTROLS) --- */
        .advanced-controls-bar { width: 100%; display: flex; justify-content: flex-start; align-items: center; margin-bottom: 40px; flex-wrap: wrap; gap: 12px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        
        /* Filter Chips */
        .control-btn { display: inline-flex; align-items: center; gap: 6px; background: transparent; border: 1px solid rgba(128, 128, 128, 0.25); color: var(--text-secondary); padding: 6px 16px; border-radius: 16px; cursor: pointer; font-size: 13px; font-weight: 700; transition: background-color 0.2s, color 0.2s; backdrop-filter: saturate(180%) blur(12px); -webkit-backdrop-filter: saturate(180%) blur(12px); }
		.control-btn.active { background-color: var(--icon-hover); color: var(--text-primary); }
        
        /* Filter Button Icons logic */
        .control-btn .icon-tick { display: none; }
        .control-btn .icon-cross { display: block; opacity: 0.7; }
        .control-btn.active .icon-tick { display: block; }
        .control-btn.active .icon-cross { display: none; }
        
        .filters-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .adv-v-line { width: 1px; height: 24px; background-color: var(--text-secondary); opacity: 0.3; margin: 0 5px; }

        /* --- CHAPTER & VERSE READER VIEWS --- */
        .reader-container { width: 100%; z-index: 2; }
        
        /* Flat Return Buttons */
        .back-btn { background: transparent; color: var(--accent); border: none; padding: 8px 16px; border-radius: 24px; font-size: 14px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background-color 0.2s ease; width: fit-content; margin-bottom: 0; }
        @media (hover: hover) { .back-btn:hover { background-color: var(--icon-hover); } }
        .back-btn:active { transform: scale(0.98); }

        .reader-chapter-title { text-align: center; margin-bottom: 60px; }
        
        .verse-block { margin-bottom: 100px; border-bottom: 1px solid var(--border); padding-bottom: 60px; }
        .verse-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        
        .verse-summary-item { font-size: 22px; line-height: 1.7; text-align: justify; text-justify: inter-word; padding-bottom: 30px; margin-bottom: 30px; border-bottom: 1px solid var(--border); }
        .verse-summary-item:last-child { border-bottom: none; }
        .verse-summary-link { color: var(--reader-accent); font-weight: 700; text-decoration: none; cursor: pointer; transition: opacity 0.2s; letter-spacing: 0.05em; }
        @media (hover: hover) { .verse-summary-link:hover { opacity: 0.8; } }

        .verse-number { color: var(--reader-accent); font-size: 30px; font-weight: 700; margin-bottom: 40px; letter-spacing: 0.05em; cursor: pointer; display: inline-block; }
        @media (hover: hover) { .verse-number:hover { opacity: 0.8; } }
        
        .verse-number-static { color: var(--reader-accent); font-size: 30px; font-weight: 700; margin-bottom: 40px; letter-spacing: 0.05em; display: inline-block; }

        .section-label { font-size: 30px; font-weight: 700; text-align: center; margin-bottom: 12px; letter-spacing: 0.05em; margin-top: 55px; text-transform: uppercase; }
        
        .devanagari-text { text-align: center; font-size: calc(32px + 1pt); line-height: 1.5; margin-bottom: 32px; font-weight: 600; font-family: 'Noto Serif Devanagari', 'Noto Serif', serif !important; }
        .devanagari-text * { font-size: inherit !important; font-weight: inherit !important; line-height: inherit !important; }
        
        .roman-text { text-align: center; font-size: 22px; line-height: 1.6; margin-bottom: 40px; font-style: italic; }
        
        .synonyms-text { font-size: 22px; line-height: 1.8; margin-bottom: 36px; text-align: justify; text-justify: inter-word; }
        .synonyms-text em { color: var(--reader-accent); font-weight: 600; font-style: italic; }
        
        .translation-text { font-size: 22px; font-weight: 700; line-height: 1.7; margin-bottom: 40px; text-align: justify; text-justify: inter-word; }
        
        .purport-text { font-size: 22px; line-height: 1.75; text-align: justify; text-justify: inter-word; hyphens: none; -webkit-hyphens: none; opacity: 0.95; }
        .purport-text p { margin-bottom: 22px; text-indent: 36px; }
        .purport-text p:first-of-type { text-indent: 0; } 
        .purport-text p.sign-off { margin-top: 50px; text-indent: 0 !important; }
        
        .quote-block { display: block; text-align: center; margin: 30px auto; font-size: 22px; line-height: 1.8; font-style: italic; width: 100%; }

        /* --- MATERIAL NAVIGATION FOOTER BUTTONS --- */
        .verse-nav-footer { display: flex; justify-content: space-between; margin-top: 40px; padding-top: 40px; border-top: 1px solid var(--border); width: 100%; }
        .nav-verse-btn { display: inline-flex; align-items: center; justify-content: center; background-color: var(--btn-bg); color: var(--btn-text); border: 1px solid transparent; padding: 12px 24px; border-radius: 24px; font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none; transition: background-color 0.2s ease, box-shadow 0.2s ease, transform 0.1s ease; }
        @media (hover: hover) { .nav-verse-btn:hover:not(.locked-btn) { background-color: var(--btn-hover); box-shadow: var(--google-shadow); } }
        .nav-verse-btn:active:not(.locked-btn) { transform: scale(0.98); }
        
        .locked-btn { opacity: 0.3 !important; pointer-events: none; cursor: default; box-shadow: none; }

        /* --- MOBILE FIREWALL --- */
        .hamburger, .mobile-menu-overlay { display: none; }
        
        /* --- PREMIUM MOBILE APP MAKEOVER --- */
        @media (max-width: 900px) {
            html { scroll-behavior: auto !important; }
            * { -webkit-tap-highlight-color: transparent; }
            body { margin: 0; }
            
            #main-content { animation: mobileFadeIn 0.5s ease forwards !important; transform: none !important; width: 100%; }
            @keyframes mobileFadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }

            nav { justify-content: space-between; padding: 0 5%; position: fixed; top: 0; width: 100%; height: 56px; z-index: 9999 !important; display: flex; align-items: center; border-bottom: 1px solid var(--border); }
            .nav-brand { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; }
            .brand-icon { width: 36px; height: 36px; margin-right: 0; }
            .nav-controls { width: 100%; height: 100%; display: flex; justify-content: space-between; align-items: center; }
            .nav-icons { order: 1; display: flex; align-items: center; gap: 4px; } 
            
            .theme-toggle, .hamburger { display: flex !important; align-items: center; justify-content: center; padding: 0 !important; margin: 0 !important; line-height: 0 !important; transform: none !important; }
            .hamburger { order: 2; background: none; border: none; cursor: pointer; z-index: 10000; transition: background-color 0.2s ease; width: 40px; height: 40px; border-radius: 50%; color: var(--text-secondary); }
            .hamburger:active { transform: scale(0.9) translateZ(0) !important; }
            .hamburger:hover { background-color: var(--icon-hover); color: var(--text-primary); }
            .hamburger svg, .theme-toggle svg { display: block; }
            .nav-links, .nav-divider { display: none; }

            .mobile-menu-overlay { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; background-color: var(--bg-main); z-index: 9998; flex-direction: column; justify-content: center; align-items: flex-start; padding: 0 8%; opacity: 0; visibility: hidden; transition: opacity 0.2s ease, visibility 0.2s ease; }
            .mobile-menu-overlay.active { opacity: 1; visibility: visible; }
            .mobile-menu-content { display: flex; flex-direction: column; align-items: flex-start; gap: 24px; width: 100%; }
            .mobile-menu-content > * { opacity: 0; transform: translateY(-15px); transition: opacity 0.2s ease, transform 0.2s ease; font-family: 'Google Sans', 'Product Sans', sans-serif !important; }
            .mobile-menu-overlay.active .mobile-menu-content > *:nth-child(1) { transition: opacity 0.4s ease 0.1s, transform 0.4s cubic-bezier(0.16,1,0.3,1) 0.1s; opacity: 1; transform: translateY(0); }
            .mobile-menu-overlay.active .mobile-menu-content > *:nth-child(2) { transition: opacity 0.4s ease 0.15s, transform 0.4s cubic-bezier(0.16,1,0.3,1) 0.15s; opacity: 1; transform: translateY(0); }
            .mobile-menu-overlay.active .mobile-menu-content > *:nth-child(3) { transition: opacity 0.3s ease 0.2s, transform 0.4s cubic-bezier(0.16,1,0.3,1) 0.2s; opacity: 1; transform: translateY(0); }
            .mobile-menu-content a { color: var(--text-primary); font-size: 24px; text-decoration: none; font-weight: 400; }
            .mobile-menu-divider { width: 100%; height: 1px; background: var(--border); margin: 8px 0; }
            .mobile-menu-footer { display: none; }

            .sanctum-wrapper { padding-top: 10vh; padding-bottom: 60px; padding-left: 5%; padding-right: 5%; }
            
            /* Compact mobile card specs */
            .google-card { padding: 40px 20px; border-radius: 20px; }
            .toc-container { gap: 24px; padding: 0 10px; }
            
            .nav-header-row { flex-direction: column-reverse; align-items: flex-start; gap: 20px; margin-bottom: 30px; }
            .breadcrumb { justify-content: center; width: 100%; font-size: 13px; text-align: center; flex-wrap: wrap; margin-bottom: 0; }
            .back-btn { margin-bottom: 0; padding: 8px 12px; }
            .adv-v-line { display: none; }
            
            .reader-chapter-title { font-size: 32px; margin-bottom: 40px; }
            #view-chapters .sanctum-title { font-size: 28px; }

            /* Mobile Search Pill */
            .search-container { margin-bottom: 24px; }
            .search-pill { padding: 6px 14px; border-radius: 20px; }
            .search-input { font-size: 14px; }
            .search-dropdown { font-size: 13px; }
            
            .verse-block { margin-bottom: 60px; padding-bottom: 40px; }
            
            .verse-summary-item { font-size: 20px; }
            .verse-number, .verse-number-static { font-size: 24px; margin-bottom: 30px; }
            .section-label { font-size: 24px; margin-bottom: 10px; margin-top: 40px; }
            
            .devanagari-text { font-size: calc(29.4px + 1pt); }
            .roman-text, .synonyms-text, .translation-text, .purport-text { font-size: 20px; }
            .quote-block { font-size: 20px; margin: 22px 0; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="nav-brand" style="text-decoration: none; color: inherit;">

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            function setMobileHeight() { document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`); }
            window.addEventListener('resize', setMobileHeight);
            window.addEventListener('orientationchange', setMobileHeight);
            setMobileHeight();
            
            let booksData = [];
            let currentChapterObj = null;
            let isAdvancedView = false;
            let activeFilters = { devanagari: true, roman: true, synonyms: true, translation: true, purport: true };

            fetch('chapters.json')
                .then(res => res.json())
                .then(data => { booksData = data; handleRoute(); })
                .catch(err => {
                    fetch('chapters.json').then(res => res.json()).then(data => { booksData = data; handleRoute(); }).catch(e => console.error("Failed to load chapters.json", e));
                });

            window.router = function(path) {
                history.pushState({}, "", path);
                handleRoute();
            };

            window.addEventListener('popstate', () => { handleRoute(); });

            function handleRoute() {
                let path = window.location.pathname.replace(/\/$/, ""); 
                if (path === "/index" || path === "/index.html" || path === "/encyclopedia.html") path = "/encyclopedia";
                
                const viewBooks = document.getElementById('view-books');
                const viewChapters = document.getElementById('view-chapters');
                const viewChapterContent = document.getElementById('view-chapter-content');
                const viewVerse = document.getElementById('view-verse');

                viewBooks.classList.remove('active');
                viewChapters.classList.remove('active');
                viewChapterContent.classList.remove('active');
                viewVerse.classList.remove('active');

                if (path === "" || path === "/encyclopedia") {
                    viewBooks.classList.add('active');
                } 
                else if (path === "/encyclopedia/bg") {
                    isAdvancedView = false;
                    const advBtn = document.getElementById('adv-toggle-btn');
                    if (advBtn) { advBtn.textContent = 'Advanced View: Off'; advBtn.classList.remove('active'); }
                    const filtersGroup = document.getElementById('filters-group');
                    if (filtersGroup) {
                        filtersGroup.style.display = 'none';
                        filtersGroup.classList.remove('stagger-in', 'fade-out-down');
                    }
                    const container = document.getElementById('chapter-content-container');
                    if (container) container.classList.remove('fade-in-up', 'fade-out-down', 'fade-in-down');

                    viewChapters.classList.add('active');
                    renderChapterDirectory();
                } 
                else {
                    const parts = path.split('/');
                    const bgIndex = parts.indexOf('bg');
                    
                    if (bgIndex !== -1 && parts.length > bgIndex + 1) {
                        const chapNum = parts[bgIndex + 1];
                        
                        if (parts.length === bgIndex + 2) {
                            viewChapterContent.classList.add('active');
                            renderChapterContent(chapNum);
                        } else if (parts.length === bgIndex + 3) {
                            const textNum = parts[bgIndex + 2];
                            viewVerse.classList.add('active');
                            renderSingleVerse(chapNum, textNum);
                        }
                    }
                }
                window.scrollTo({ top: 0, behavior: 'instant' });
            }

            function renderChapterDirectory() {
                const container = document.getElementById('chapter-list-container');
                container.innerHTML = '';
                if (booksData.length === 0) return;
                
                const book = booksData[0];
                
                ['Setting the Scene', 'Dedication', 'Preface', 'Introduction'].forEach(title => {
                    const a = document.createElement('a');
                    a.className = 'toc-link locked';
                    a.textContent = title;
                    container.appendChild(a);
                });

                book.chapters.forEach(chap => {
                    const link = document.createElement('a');
                    link.className = 'toc-link';
                    const cleanTitle = chap.chapter_title.replace(/<br>/g, ' ');
                    link.innerHTML = `Chapter ${chap.chapter_number}: ${cleanTitle}`;
                    link.onclick = () => { router(`/encyclopedia/bg/${chap.chapter_id}/`); };
                    container.appendChild(link);
                });

                const lockedChapters = [
                    'Chapter Three: Karma-yoga', 'Chapter Four: Transcendental Knowledge', 'Chapter Five: Karma-yoga – Action in Kṛṣṇa Consciousness', 'Chapter Six: Dhyāna-yoga', 'Chapter Seven: Knowledge of the Absolute', 'Chapter Eight: Attaining the Supreme', 'Chapter Nine: The Most Confidential Knowledge', 'Chapter Ten: The Opulence of the Absolute', 'Chapter Eleven: The Universal Form', 'Chapter Twelve: Devotional Service', 'Chapter Thirteen: Nature, the Enjoyer, and Consciousness', 'Chapter Fourteen: The Three Modes of Material Nature', 'Chapter Fifteen: The Yoga of the Supreme Person', 'Chapter Sixteen: The Divine and Demoniac Natures', 'Chapter Seventeen: The Divisions of Faith', 'Chapter Eighteen: Conclusion – The Perfection of Renunciation'
                ];
                lockedChapters.forEach(title => {
                    const a = document.createElement('a');
                    a.className = 'toc-link locked';
                    a.textContent = title;
                    container.appendChild(a);
                });
            }

            function renderChapterContent(chapId) {
                if (booksData.length === 0) return;
                const book = booksData[0];
                currentChapterObj = book.chapters.find(c => c.chapter_id == chapId);
                if (!currentChapterObj) return;

                document.getElementById('content-breadcrumb').innerHTML = `
                    <a onclick="router('/encyclopedia')">Encyclopedia</a> <span class="separator">&gt;&gt;</span>
                    <a onclick="router('/encyclopedia/bg/')">Bhagavad-gītā As It Is</a> <span class="separator">&gt;&gt;</span>
                    <span style="color: var(--text-primary);">Ch. ${currentChapterObj.chapter_id}</span>
                `;

                document.getElementById('content-chapter-title').innerHTML = `
                    <span style="font-size: 20px; font-weight: 500; display: block; margin-bottom: 12px; letter-spacing: 0.1em; color: var(--text-secondary); text-transform: uppercase;">Chapter ${currentChapterObj.chapter_number}</span>
                    <span style="font-size: 40px; font-weight: 700; line-height: 1.25; display: block; color: var(--text-primary);">${currentChapterObj.chapter_title}</span>
                `;
                
                reRenderChapterContent();
            }

            window.toggleAdvancedView = function() {
                const btn = document.getElementById('adv-toggle-btn');
                const filtersGroup = document.getElementById('filters-group');
                const container = document.getElementById('chapter-content-container');

                if (isAdvancedView) {
                    isAdvancedView = false;
                    btn.textContent = `Advanced View: Off`;
                    btn.classList.remove('active');
                    
                    filtersGroup.classList.remove('stagger-in');
                    filtersGroup.classList.add('fade-out-down');
                    
                    container.classList.remove('fade-in-up');
                    container.classList.add('fade-out-down');
                    
                    setTimeout(() => {
                        filtersGroup.style.display = 'none';
                        reRenderChapterContent(); 
                        container.classList.remove('fade-out-down');
                        container.classList.add('fade-in-down');
                    }, 250); 
                } else {
                    isAdvancedView = true;
                    btn.textContent = `Advanced View: On`;
                    btn.classList.add('active');
                    
                    filtersGroup.style.display = 'flex';
                    filtersGroup.classList.remove('fade-out-down');
                    filtersGroup.classList.add('stagger-in');
                    
                    container.classList.remove('fade-in-down', 'fade-out-down');
                    reRenderChapterContent(); 
                    
                    container.style.animation = 'none';
                    container.offsetHeight; 
                    container.style.animation = ''; 
                    container.classList.add('fade-in-up');
                }
            };

            window.toggleFilter = function(filterName) {
                activeFilters[filterName] = !activeFilters[filterName];
                event.target.classList.toggle('active', activeFilters[filterName]);
                reRenderChapterContent(); 
            };

            function reRenderChapterContent() {
                if (!currentChapterObj) return;
                const container = document.getElementById('chapter-content-container');
                container.innerHTML = '';

                if (!isAdvancedView) {
                    let html = `<div style="display: flex; flex-direction: column; width: 100%;">`;
                    currentChapterObj.verses.forEach(verse => {
                        let numStr = verse.text_number.toUpperCase();
                        let textLabel = numStr.includes('-') ? `TEXTS ${numStr}` : `TEXT ${numStr}`;
                        let cleanTranslation = verse.translation ? verse.translation.replace(/<\/?p[^>]*>/g, '') : '';

                        html += `<div class="verse-summary-item">
                            <a onclick="router('/encyclopedia/bg/${currentChapterObj.chapter_id}/${verse.text_number}')" class="verse-summary-link">[${textLabel}]</a> 
                            <span style="font-weight: 400;">${cleanTranslation}</span>
                        </div>`;
                    });
                    html += `</div>`;
                    container.innerHTML = html;
                } else {
                    currentChapterObj.verses.forEach(verse => {
                        let html = `<div class="verse-block">`;
                        let numStr = verse.text_number.toUpperCase();
                        let textLabel = numStr.includes('-') ? `TEXTS ${numStr}` : `TEXT ${numStr}`;
                        
                        html += `<div style="text-align: center;"><a onclick="router('/encyclopedia/bg/${currentChapterObj.chapter_id}/${verse.text_number}')" style="text-decoration: none; display: inline-block;"><div class="verse-number">${textLabel}</div></a></div>`;
                        
                        if (verse.devanagari && activeFilters.devanagari) html += `<div class="devanagari-text">${verse.devanagari}</div>`;
                        if (verse.roman && activeFilters.roman) html += `<div class="roman-text">${verse.roman}</div>`;
                        if (verse.synonyms && activeFilters.synonyms) html += `<div class="section-label">SYNONYMS</div><div class="synonyms-text">${verse.synonyms}</div>`;
                        if (verse.translation && activeFilters.translation) html += `<div class="section-label">TRANSLATION</div><div class="translation-text">${verse.translation}</div>`;
                        if (verse.purport && activeFilters.purport) html += `<div class="section-label">PURPORT</div><div class="purport-text">${verse.purport}</div>`;
                        
                        html += `</div>`;
                        container.innerHTML += html;
                    });
                }
            }

            function renderSingleVerse(chapId, textNum) {
                if (booksData.length === 0) return;
                const book = booksData[0];
                const chapter = book.chapters.find(c => c.chapter_id == chapId);
                if (!chapter) return;

                const verseIndex = chapter.verses.findIndex(v => v.text_number == textNum);
                const verse = chapter.verses[verseIndex];
                if (!verse) return;
                
                document.getElementById('verse-breadcrumb').innerHTML = `
                    <a onclick="router('/encyclopedia')">Encyclopedia</a> <span class="separator">&gt;&gt;</span>
                    <a onclick="router('/encyclopedia/bg/')">Bhagavad-gītā As It Is</a> <span class="separator">&gt;&gt;</span>
                    <span style="color: var(--text-primary);">Ch. ${chapter.chapter_id}</span>
                `;

                document.getElementById('verse-back-btn').setAttribute('onclick', `router('/encyclopedia/bg/${chapter.chapter_id}/')`);

                const container = document.getElementById('single-verse-container');
                container.innerHTML = '';

                let html = `<div class="verse-block" style="border: none; padding-bottom: 0; margin-bottom: 0;">`;
                let numStr = verse.text_number.toUpperCase();
                let textLabel = `Bg. ${chapter.chapter_id}.${numStr}`;
                
                html += `<div style="text-align: center;"><div class="verse-number-static">${textLabel}</div></div>`;
                
                if (verse.devanagari) html += `<div class="devanagari-text">${verse.devanagari}</div>`;
                if (verse.roman) html += `<div class="roman-text">${verse.roman}</div>`;
                if (verse.synonyms) html += `<div class="section-label">SYNONYMS</div><div class="synonyms-text">${verse.synonyms}</div>`;
                if (verse.translation) html += `<div class="section-label">TRANSLATION</div><div class="translation-text">${verse.translation}</div>`;
                if (verse.purport) html += `<div class="section-label">PURPORT</div><div class="purport-text">${verse.purport}</div>`;
                
                html += `</div>`;
                container.innerHTML = html;
                
                container.style.animation = 'none';
                container.offsetHeight; 
                container.style.animation = 'fadeInUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards';

                const prevBtn = document.getElementById('prev-verse-btn');
                const nextBtn = document.getElementById('next-verse-btn');

                if (verseIndex > 0) {
                    prevBtn.classList.remove('locked-btn');
                    prevBtn.onclick = () => router(`/encyclopedia/bg/${chapter.chapter_id}/${chapter.verses[verseIndex - 1].text_number}`);
                } else {
                    prevBtn.classList.add('locked-btn');
                    prevBtn.onclick = null;
                }

                if (verseIndex < chapter.verses.length - 1) {
                    nextBtn.classList.remove('locked-btn');
                    nextBtn.onclick = () => router(`/encyclopedia/bg/${chapter.chapter_id}/${chapter.verses[verseIndex + 1].text_number}`);
                } else {
                    nextBtn.classList.add('locked-btn');
                    nextBtn.onclick = null;
                }
            }

            const themeBtn = document.getElementById('themeBtn');
            const root = document.documentElement;
            const icon = document.getElementById('theme-icon');
            const moonSvg = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
            const sunSvg = `<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`;
            if (root.getAttribute('data-theme') === 'light') { icon.innerHTML = moonSvg; } else { icon.innerHTML = sunSvg; }

            themeBtn.addEventListener('click', () => {
                const currentTheme = root.getAttribute('data-theme');
                if (currentTheme === 'dark') {
                    root.setAttribute('data-theme', 'light');
                    localStorage.setItem('vanisagara_theme', 'light');
                    icon.innerHTML = moonSvg;
                } else {
                    root.setAttribute('data-theme', 'dark');
                    localStorage.setItem('vanisagara_theme', 'dark');
                    icon.innerHTML = sunSvg;
                }
            });

            const hamburgerBtn = document.getElementById('hamburgerBtn');
            const mobileMenu = document.getElementById('mobileMenu');
            if (hamburgerBtn && mobileMenu) {
                hamburgerBtn.addEventListener('click', () => {
                    mobileMenu.classList.toggle('active');
                    document.body.classList.toggle('no-scroll');
                    if (mobileMenu.classList.contains('active')) {
                        hamburgerBtn.innerHTML = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;
                    } else {
                        hamburgerBtn.innerHTML = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>`;
                    }
                });

                const menuLinks = mobileMenu.querySelectorAll('a');
                menuLinks.forEach(link => {
                    link.addEventListener('click', () => {
                        mobileMenu.classList.remove('active');
                        document.body.classList.remove('no-scroll');
                        hamburgerBtn.innerHTML = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>`;
                    });
                });
            }

            if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }
            let currentPath = window.location.pathname;
            if (currentPath.endsWith('/')) { currentPath += 'index.html'; }
            const scrollKey = 'vanisagara_scroll_' + currentPath;
            const navType = performance.getEntriesByType("navigation")[0]?.type;
            const previousPath = sessionStorage.getItem('vanisagara_current_page');
            const isRefreshEquivalent = (navType === 'reload') || (navType === 'back_forward') || (navType === 'navigate' && previousPath === currentPath);
            
            if (isRefreshEquivalent) {
                const savedScrollPosition = sessionStorage.getItem(scrollKey);
                if (savedScrollPosition !== null) {
                    document.documentElement.style.scrollBehavior = 'auto';
                    window.scrollTo({ top: parseInt(savedScrollPosition, 10), behavior: 'instant' });
                    setTimeout(() => { document.documentElement.style.scrollBehavior = 'smooth'; }, 50);
                }
            } else {
                sessionStorage.removeItem(scrollKey);
                window.scrollTo({ top: 0, behavior: 'instant' });
            }
            sessionStorage.setItem('vanisagara_current_page', currentPath);

            let scrollTimeout;
            window.addEventListener('scroll', () => {
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => { sessionStorage.setItem(scrollKey, window.scrollY); }, 150);
            });
        });
    </script>
</body>
</html>
