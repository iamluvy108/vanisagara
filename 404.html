<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vāṇīsāgara (The Sanctum)</title>
    
    <!-- IMPORT NOTO SERIF -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
    
    <!-- PREVENTS THEME FLASHING ON PAGE LOAD -->
    <script>
        const savedTheme = localStorage.getItem('vanisagara_theme');
        if (savedTheme) { document.documentElement.setAttribute('data-theme', savedTheme); }
    </script>

    <style>
        :root {
            --bg-main: #141414; 
            --bg-nav: rgba(20, 20, 20, 0.7); 
            --text-primary: #f5f5f7; 
            --text-secondary: #86868b; 
            --accent: #ffffff; 
            --border: rgba(255, 255, 255, 0.1);
            --toc-link-color: #d1bfae; 
            --toc-hover-color: #ffffff;
            --reader-red: #ff6b6b; 
        }

        [data-theme="light"] {
            --bg-main: #ffffff; 
            --bg-nav: rgba(255, 255, 255, 0.7); 
            --text-primary: #000000; 
            --text-secondary: #5e5e60; 
            --accent: #1d1d1f; 
            --border: rgba(0, 0, 0, 0.1);
            --toc-link-color: #8c2318; 
            --toc-hover-color: #000000;
            --reader-red: #7A1111; 
        }

        html { scroll-behavior: smooth; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Serif', serif; }

        body {
            background-color: var(--bg-main); color: var(--text-primary);
            transition: background-color 0.4s ease, color 0.4s ease;
            overflow-y: scroll; overflow-x: hidden; display: flex; flex-direction: column; min-height: 100vh;
            -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
        }

        #main-content { backface-visibility: hidden; -webkit-backface-visibility: hidden; transform-style: preserve-3d; perspective: 1000px; will-change: transform, opacity; }
        .theme-toggle, .hamburger, .back-btn, .control-btn { backface-visibility: hidden; -webkit-backface-visibility: hidden; transform: translateZ(0); -webkit-font-smoothing: subpixel-antialiased; }

        #main-content { animation: appEnter 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s ease; width: 100%; overflow-x: hidden; }
        #main-content.page-exit { transform: translateY(-15px); opacity: 0; }
        @keyframes appEnter { 0% { transform: translateY(20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

        /* --- NAVIGATION --- */
        nav { position: fixed; top: 0; width: 100%; height: 60px; background: var(--bg-nav); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); display: flex; align-items: center; justify-content: space-between; padding: 0 5%; z-index: 100; border-bottom: 1px solid var(--border); transition: background 0.4s ease; }
        .nav-brand { display: inline-block; font-size: 22px; text-decoration: none; color: var(--text-primary); white-space: nowrap; }
        .brand-icon { width: 24px; height: 24px; object-fit: contain; vertical-align: middle; margin-right: 8px; position: relative; top: -1px; }
        .nav-controls { display: flex; align-items: center; gap: 20px; }
        .nav-links { display: flex; list-style: none; gap: 24px; }
        .nav-links a { text-decoration: none; color: var(--text-primary); font-size: 15px; font-weight: 500; transition: opacity 0.2s; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        .nav-links a:hover { opacity: 0.7; }
        .nav-divider { width: 1px; height: 28px; background-color: var(--text-secondary); opacity: 0.4; }
        .nav-icons { display: flex; align-items: center; gap: 12px; }
        .theme-toggle { background: none; border: none; color: var(--text-primary); cursor: pointer; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease, visibility 0.3s ease; }
        .theme-toggle:active { transform: scale(0.85) translateZ(0); }
        .theme-toggle:hover { opacity: 0.7; }

        /* --- SANCTUM LOBBY & VIEWS --- */
        .sanctum-wrapper { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; padding: 140px 5% 100px 5%; overflow: hidden; z-index: 2; }
        
        .view-section { width: 100%; display: none; flex-direction: column; align-items: center; animation: fadeIn 0.4s ease forwards; }
        .view-section.active { display: flex; }

        .sanctum-header { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 60px; width: 100%; }
        /* Title matching "About Us" page style */
        .sanctum-title { font-size: clamp(40px, 6vw, 72px); font-weight: 400; line-height: 1.1; margin-bottom: 24px; font-family: 'Noto Serif', serif; color: var(--text-primary); }

        .toc-container { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 22px; width: 100%; max-width: 900px; margin: 0 auto; text-align: left; }
        .toc-link { font-size: clamp(18px, 2.5vw, 24px); color: var(--toc-link-color); text-decoration: none; transition: opacity 0.2s ease, color 0.2s ease; display: block; line-height: 1.4; letter-spacing: 0.01em; cursor: pointer; }
        
        @media (hover: hover) { .toc-link:hover:not(.locked) { color: var(--toc-hover-color); opacity: 0.8; } }
        .toc-link:active:not(.locked) { opacity: 0.5; transition: opacity 0.1s ease; }
        .toc-link.locked { opacity: 0.35; pointer-events: none; cursor: default; }

        /* --- ADVANCED VIEW CONTROLS --- */
        .advanced-controls-bar { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; flex-wrap: wrap; gap: 15px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        .control-btn { background: var(--border); border: none; color: var(--text-primary); padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 600; transition: background 0.2s; }
        .control-btn.active { background: var(--reader-red); color: white; }
        .filters-group { display: flex; gap: 10px; flex-wrap: wrap; }

        /* --- CHAPTER & VERSE READER VIEWS --- */
        .reader-container { width: 100%; max-width: 900px; margin: 0 auto; z-index: 2; }
        .back-btn { background: none; border: none; color: var(--text-secondary); font-size: 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 40px; font-weight: 500; transition: opacity 0.2s; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        @media (hover: hover) { .back-btn:hover { opacity: 0.7; } }
        .back-btn:active { opacity: 0.5; }

        .reader-chapter-title { font-size: clamp(32px, 5vw, 44px); font-weight: 700; margin-bottom: 60px; text-align: center; line-height: 1.3; color: var(--text-primary); }
        
        .verse-block { margin-bottom: 100px; border-bottom: 1px solid var(--border); padding-bottom: 60px; }
        .verse-block:last-child { border-bottom: none; }
        
        .verse-number { color: var(--reader-red); font-size: 36px; font-weight: 700; text-align: center; margin-bottom: 40px; letter-spacing: 0.05em; cursor: pointer; display: inline-block; width: 100%; }
        .verse-number:hover { opacity: 0.8; text-decoration: underline; }

        .section-label { font-size: 30px; font-weight: 700; text-align: center; margin-bottom: 12px; letter-spacing: 0.05em; margin-top: 55px; text-transform: uppercase; }
        
        .devanagari-text { text-align: center; font-size: 35.4px; line-height: 1.8; margin-bottom: 32px; font-weight: 600; }
        .roman-text { text-align: center; font-size: 22px; line-height: 1.6; margin-bottom: 40px; font-style: italic; }
        
        .synonyms-text { font-size: 22px; line-height: 1.8; margin-bottom: 36px; text-align: justify; text-justify: inter-word; }
        .synonyms-text em { color: var(--reader-red); font-weight: 600; font-style: italic; }
        
        .translation-text { font-size: 22px; font-weight: 700; line-height: 1.7; margin-bottom: 40px; text-align: justify; text-justify: inter-word; }
        
        .purport-text { font-size: 22px; line-height: 1.75; text-align: justify; text-justify: inter-word; hyphens: none; -webkit-hyphens: none; opacity: 0.95; }
        .purport-text p { margin-bottom: 22px; text-indent: 36px; }
        .purport-text p:first-of-type { text-indent: 0; } 
        .purport-text p.sign-off { margin-top: 50px; text-indent: 0 !important; }
        
        .quote-block { display: block; text-align: center; margin: 30px auto; font-size: 22px; line-height: 1.8; font-style: italic; width: 100%; }

        /* --- NAVIGATION FOOTER BUTTONS --- */
        .verse-nav-footer { display: flex; justify-content: space-between; margin-top: 80px; padding-top: 30px; border-top: 1px solid var(--border); }
        .nav-verse-btn { background: var(--border); border: none; color: var(--text-primary); padding: 12px 24px; border-radius: 4px; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; transition: background 0.2s; }
        .nav-verse-btn:hover { background: var(--text-secondary); color: white; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- MOBILE FIREWALL --- */
        .hamburger, .mobile-menu-overlay { display: none; }
        @media (max-width: 900px) {
            html { scroll-behavior: auto !important; }
            * { -webkit-tap-highlight-color: transparent; }
            body { margin: 0; }
            #main-content { animation: mobileFadeIn 0.5s ease forwards !important; transform: none !important; width: 100%; }
            @keyframes mobileFadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
            html.no-scroll, body.no-scroll { overflow: hidden !important; scroll-snap-type: none !important; }
            
            nav { justify-content: space-between; padding: 0 5%; position: fixed; top: 0; width: 100%; height: 60px; z-index: 9999 !important; display: flex; align-items: center; }
            .nav-brand { position: absolute; left: 50%; top: 55%; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; }
            .brand-icon { width: 44px; height: 44px; margin-right: 0; }
            .nav-controls { width: 100%; height: 100%; display: flex; justify-content: space-between; align-items: center; }
            .nav-icons { order: 1; display: flex; align-items: center; gap: 15px; } 
            .theme-toggle:active { transform: scale(0.85) translateZ(0); }
            
            .hamburger { order: 2; background: none; border: none; cursor: pointer; z-index: 10000; transition: transform 0.2s ease; display: flex !important; align-items: center; justify-content: center; padding: 0 !important; margin: 0 !important; transform: translateY(1.5px) !important; }
            .hamburger:active { transform: translateY(1.5px) scale(0.85) translateZ(0) !important; }
            .hamburger svg, .theme-toggle svg { display: block; }
            [data-theme="dark"] .theme-toggle, [data-theme="dark"] .hamburger { color: #ffffff !important; }
            .nav-links, .nav-divider { display: none; }

            .mobile-menu-overlay { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; background-color: var(--bg-main); z-index: 9998; flex-direction: column; justify-content: center; align-items: center; padding-top: 0; padding-bottom: 12vh; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease; }
            .mobile-menu-overlay.active { opacity: 1; visibility: visible; }
            .mobile-menu-content { display: flex; flex-direction: column; align-items: center; gap: 14px; }
            .mobile-menu-content > * { opacity: 0; transform: translateY(-15px); transition: opacity 0.2s ease, transform 0.2s ease; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
            .mobile-menu-overlay.active .mobile-menu-content > *:nth-child(1) { transition: opacity 0.4s ease 0.1s, transform 0.4s cubic-bezier(0.16,1,0.3,1) 0.1s; opacity: 1; transform: translateY(0); }
            .mobile-menu-overlay.active .mobile-menu-content > *:nth-child(2) { transition: opacity 0.4s ease 0.2s, transform 0.4s cubic-bezier(0.16,1,0.3,1) 0.2s; opacity: 1; transform: translateY(0); }
            .mobile-menu-overlay.active .mobile-menu-content > *:nth-child(3) { transition: opacity 0.4s ease 0.3s, transform 0.4s cubic-bezier(0.16,1,0.3,1) 0.3s; opacity: 1; transform: translateY(0); }
            .mobile-menu-overlay.active .mobile-menu-content > *:nth-child(4) { transition: opacity 0.4s ease 0.4s, transform 0.4s cubic-bezier(0.16,1,0.3,1) 0.4s; opacity: 1; transform: translateY(0); }
            .mobile-menu-content a { color: var(--text-primary); font-size: 22px; text-decoration: none; font-weight: 400; }
            .mobile-menu-divider { width: 180px; height: 1px; background: linear-gradient(90deg, transparent, var(--text-primary), transparent); opacity: 0.4; }
            .mobile-menu-footer { position: absolute; bottom: 8vh; }
            .menu-logo { width: 140px; height: auto; opacity: 0.95; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3)); }

            .sanctum-wrapper { padding-top: 110px; padding-bottom: 60px; }
            .toc-container { gap: 24px; padding: 0 10px; }
            
            .reader-chapter-title { font-size: 32px; margin-bottom: 50px; }
            .verse-block { margin-bottom: 60px; padding-bottom: 40px; }
            
            .verse-number { font-size: 28px; margin-bottom: 30px; }
            .section-label { font-size: 24px; margin-bottom: 10px; margin-top: 40px; }
            .devanagari-text { font-size: 29.4px; }
            .roman-text, .synonyms-text, .translation-text, .purport-text { font-size: 20px; }
            .quote-block { font-size: 20px; margin: 22px 0; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="nav-brand" style="text-decoration: none; color: inherit; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;">
            <img src="images/logos/website/transparent/vanisagara-white.webp" alt="Vāṇīsāgara Logo" class="brand-icon logo-dark"><img src="images/logos/website/transparent/vanisagara-black.webp" alt="Vāṇīsāgara Logo" class="brand-icon logo-light"><span class="vanisagara-text" style="font-family: 'Noto Serif', serif !important;">Vāṇīsāgara</span>
        </a>
        <div class="nav-controls">
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/sanctum">Sanctum</a></li>
                <li><a href="/about-us">About Us</a></li>
            </ul>
            <div class="nav-divider"></div>
            
            <div class="nav-icons">
                <button class="theme-toggle" id="themeBtn" aria-label="Toggle Theme">
                    <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
                </button>
            </div>

            <button class="hamburger" id="hamburgerBtn" aria-label="Menu">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
        </div>
    </nav>

    <div class="mobile-menu-overlay" id="mobileMenu">
        <div class="mobile-menu-content">
            <a href="/">Home</a>
            <a href="/sanctum">Sanctum</a>
            <div class="mobile-menu-divider"></div>
            <a href="/about-us">About Us</a>
        </div>
        <div class="mobile-menu-footer">
            <img src="images/logos/website/transparent/vanisagara-white.webp" alt="Logo" class="menu-logo logo-dark">
            <img src="images/logos/website/transparent/vanisagara-black.webp" alt="Logo" class="menu-logo logo-light">
        </div>
    </div>

    <!-- MAIN SANCTUM ROUTER WRAPPER -->
    <main class="sanctum-wrapper" id="main-content">
        
        <!-- VIEW 1: THE BOOK DIRECTORY (/sanctum) -->
        <div id="view-books" class="view-section">
            <section class="sanctum-header">
                <h1 class="sanctum-title">The Sanctum</h1>
            </section>
            <section class="toc-container">
                <a onclick="router('/sanctum/bg/')" class="toc-link">Bhagavad-gītā As It Is (1972 Edition)</a>
            </section>
        </div>

        <!-- VIEW 2: THE CHAPTER DIRECTORY (/sanctum/bg/) -->
        <div id="view-chapters" class="view-section">
            <div class="reader-container">
                <button class="back-btn" onclick="router('/sanctum')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Return to Books
                </button>
                <section class="sanctum-header" style="margin-bottom: 40px;">
                    <h1 class="sanctum-title">Bhagavad-gītā As It Is</h1>
                </section>

                <!-- Advanced View Toggle Bar -->
                <div class="advanced-controls-bar">
                    <button class="control-btn" id="adv-toggle-btn" onclick="toggleAdvancedView()">Advanced View: Off</button>
                    <div class="filters-group" id="filters-group" style="display: none;">
                        <button class="control-btn active" onclick="toggleFilter('devanagari')">Devanagari</button>
                        <button class="control-btn active" onclick="toggleFilter('roman')">Transliteration</button>
                        <button class="control-btn active" onclick="toggleFilter('synonyms')">Synonyms</button>
                        <button class="control-btn active" onclick="toggleFilter('translation')">Translation</button>
                        <button class="control-btn active" onclick="toggleFilter('purport')">Purport</button>
                    </div>
                </div>

                <section class="toc-container" id="chapter-list-container"></section>
            </div>
        </div>

        <!-- VIEW 3: THE SINGLE VERSE READER (/sanctum/bg/#/#) -->
        <div id="view-verse" class="view-section">
            <div class="reader-container">
                <button class="back-btn" id="verse-back-btn" onclick="router('/sanctum/bg/')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Return to Chapters
                </button>
                <h2 id="single-verse-chapter-title" class="reader-chapter-title"></h2>
                <div id="single-verse-container"></div>
                <div class="verse-nav-footer">
                    <button class="nav-verse-btn" id="prev-verse-btn">< Previous Verse</button>
                    <button class="nav-verse-btn" id="next-verse-btn">Next Verse ></button>
                </div>
            </div>
        </div>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            function setMobileHeight() { document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`); }
            window.addEventListener('resize', setMobileHeight);
            window.addEventListener('orientationchange', setMobileHeight);
            setMobileHeight();
            
            let booksData = [];
            let isAdvancedView = false;
            let activeFilters = { devanagari: true, roman: true, synonyms: true, translation: true, purport: true };

            // Fetch JSON data and initialize router
            fetch('/chapters.json')
                .then(res => res.json())
                .then(data => {
                    booksData = data;
                    handleRoute();
                })
                .catch(err => {
                    // Fallback relative path check if hosted in subfolder
                    fetch('chapters.json').then(res => res.json()).then(data => { booksData = data; handleRoute(); }).catch(e => console.error("Failed to load chapters.json", e));
                });

            // Intercept internal link clicks for SPA routing
            window.router = function(path) {
                history.pushState({}, "", path);
                handleRoute();
            };

            window.addEventListener('popstate', () => { handleRoute(); });

            function handleRoute() {
                const path = window.location.pathname.replace(/\/$/, ""); // Strip trailing slash
                
                // Views
                const viewBooks = document.getElementById('view-books');
                const viewChapters = document.getElementById('view-chapters');
                const viewVerse = document.getElementById('view-verse');

                viewBooks.classList.remove('active');
                viewChapters.classList.remove('active');
                viewVerse.classList.remove('active');

                if (path === "" || path === "/sanctum" || path.endsWith("sanctum.html")) {
                    viewBooks.classList.add('active');
                } 
                else if (path.endsWith("/sanctum/bg")) {
                    viewChapters.classList.add('active');
                    renderChapterDirectory();
                } 
                else if (path.includes("/sanctum/bg/")) {
                    const parts = path.split('/');
                    const chapNum = parts[parts.length - 2];
                    const textNum = parts[parts.length - 1];
                    viewVerse.classList.add('active');
                    renderSingleVerse(chapNum, textNum);
                }
                window.scrollTo({ top: 0, behavior: 'instant' });
            }

            function renderChapterDirectory() {
                const container = document.getElementById('chapter-list-container');
                container.innerHTML = '';
                if (booksData.length === 0) return;
                
                const book = booksData[0]; // Bhagavad Gita
                book.chapters.forEach(chap => {
                    const link = document.createElement('a');
                    link.className = 'toc-link';
                    link.innerHTML = `Chapter ${chap.chapter_number}: ${chap.chapter_title}`;
                    link.onclick = () => { router(`/sanctum/bg/${chap.chapter_number}/1`); };
                    container.appendChild(link);
                });
            }

            window.toggleAdvancedView = function() {
                isAdvancedView = !isAdvancedView;
                const btn = document.getElementById('adv-toggle-btn');
                const filtersGroup = document.getElementById('filters-group');
                btn.textContent = `Advanced View: ${isAdvancedView ? 'On' : 'Off'}`;
                btn.classList.toggle('active', isAdvancedView);
                filtersGroup.style.display = isAdvancedView ? 'flex' : 'none';
            };

            window.toggleFilter = function(filterName) {
                activeFilters[filterName] = !activeFilters[filterName];
                event.target.classList.toggle('active', activeFilters[filterName]);
            };

            function renderSingleVerse(chapNum, textNum) {
                if (booksData.length === 0) return;
                const book = booksData[0];
                const chapter = book.chapters.find(c => c.chapter_number == chapNum);
                if (!chapter) return;

                const verseIndex = chapter.verses.findIndex(v => v.text_number == textNum);
                const verse = chapter.verses[verseIndex];
                if (!verse) return;

                document.getElementById('single-verse-chapter-title').innerHTML = `CHAPTER ${chapter.chapter_number}<br><span style="font-size: 0.65em; font-weight: 400; margin-top: 15px; display: block;">${chapter.chapter_title}</span>`;
                document.getElementById('verse-back-btn').setAttribute('onclick', `router('/sanctum/bg/')`);

                const container = document.getElementById('single-verse-container');
                container.innerHTML = '';

                let html = `<div class="verse-block">`;
                let numStr = verse.text_number.toUpperCase();
                let textLabel = numStr.includes('-') ? `TEXTS ${numStr}` : `TEXT ${numStr}`;
                
                // Clicking text number takes back to chapter directory or toggles view
                html += `<div class="verse-number" onclick="router('/sanctum/bg/')">${textLabel}</div>`;
                
                if (verse.devanagari && activeFilters.devanagari) html += `<div class="devanagari-text">${verse.devanagari}</div>`;
                if (verse.roman && activeFilters.roman) html += `<div class="roman-text">${verse.roman}</div>`;
                if (verse.synonyms && activeFilters.synonyms) html += `<div class="section-label">SYNONYMS</div><div class="synonyms-text">${verse.synonyms}</div>`;
                if (verse.translation && activeFilters.translation) html += `<div class="section-label">TRANSLATION</div><div class="translation-text">${verse.translation}</div>`;
                if (verse.purport && activeFilters.purport) html += `<div class="section-label">PURPORT</div><div class="purport-text">${verse.purport}</div>`;
                
                html += `</div>`;
                container.innerHTML = html;

                // Previous / Next Verse Buttons
                const prevBtn = document.getElementById('prev-verse-btn');
                const nextBtn = document.getElementById('next-verse-btn');

                if (verseIndex > 0) {
                    prevBtn.style.display = 'block';
                    prevBtn.onclick = () => router(`/sanctum/bg/${chapter.chapter_number}/${chapter.verses[verseIndex - 1].text_number}`);
                } else {
                    prevBtn.style.display = 'none';
                }

                if (verseIndex < chapter.verses.length - 1) {
                    nextBtn.style.display = 'block';
                    nextBtn.onclick = () => router(`/sanctum/bg/${chapter.chapter_number}/${chapter.verses[verseIndex + 1].text_number}`);
                } else {
                    nextBtn.style.display = 'none';
                }
            }

            // Theme Toggle logic
            const themeBtn = document.getElementById('themeBtn');
            const root = document.documentElement;
            const icon = document.getElementById('theme-icon');
            const moonSvg = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
            const sunSvg = `<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`;
            if (root.getAttribute('data-theme') === 'light') { icon.innerHTML = moonSvg; } else { icon.innerHTML = sunSvg; }

            themeBtn.addEventListener('click', () => {
                const currentTheme = root.getAttribute('data-theme');
                if (currentTheme === 'dark') {
                    root.setAttribute('data-theme', 'light');
                    localStorage.setItem('vanisagara_theme', 'light');
                    icon.innerHTML = moonSvg;
                } else {
                    root.setAttribute('data-theme', 'dark');
                    localStorage.setItem('vanisagara_theme', 'dark');
                    icon.innerHTML = sunSvg;
                }
            });
        });
    </script>
</body>
</html>
